spring.application.name=banking-security
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3307/banking_app
spring.datasource.username=root
spring.datasource.password=rootPassword1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.error.include-message=always
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
logging.level.com.example.banking=DEBUG
logging.file.name=logs/banking.log

